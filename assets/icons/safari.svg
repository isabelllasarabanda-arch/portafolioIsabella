<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <linearGradient id="safariGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a8cff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0050d0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="60" height="60" rx="13" ry="13" fill="url(#safariGrad)"/>
  <circle cx="30" cy="30" r="20" fill="white" opacity="0.15"/>
  <circle cx="30" cy="30" r="18" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- compass needle -->
  <polygon points="30,14 33,28 30,32 27,28" fill="#FF3B30"/>
  <polygon points="30,46 27,32 30,28 33,32" fill="white"/>
  <!-- compass cardinal marks -->
  <text x="30" y="12" text-anchor="middle" fill="white" font-size="5" font-family="Arial" font-weight="bold">N</text>
  <text x="30" y="52" text-anchor="middle" fill="white" font-size="5" font-family="Arial" font-weight="bold">S</text>
  <text x="10" y="32" text-anchor="middle" fill="white" font-size="5" font-family="Arial" font-weight="bold">W</text>
  <text x="50" y="32" text-anchor="middle" fill="white" font-size="5" font-family="Arial" font-weight="bold">E</text>
  <circle cx="30" cy="30" r="2.5" fill="white"/>
</svg>
