<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <linearGradient id="calGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF3B30;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="60" height="60" rx="13" ry="13" fill="white"/>
  <!-- header strip -->
  <rect x="0" y="0" width="60" height="20" rx="13" ry="13" fill="url(#calGrad)"/>
  <rect x="0" y="10" width="60" height="10" fill="url(#calGrad)"/>
  <!-- calendar header text -->
  <text x="30" y="15" text-anchor="middle" fill="white" font-size="8" font-family="Arial" font-weight="bold">OCT</text>
  <!-- day number -->
  <text x="30" y="44" text-anchor="middle" fill="#1c1c1e" font-size="26" font-family="Arial" font-weight="bold">30</text>
  <!-- ring hangers -->
  <rect x="18" y="0" width="4" height="6" rx="2" fill="#c0392b"/>
  <rect x="38" y="0" width="4" height="6" rx="2" fill="#c0392b"/>
</svg>
